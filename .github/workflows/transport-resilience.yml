name: Transport resilience

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-resilience-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tcp-fault-and-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.9
          cache: true

      - name: Verify module checksums
        run: go mod verify

      - name: Run deterministic TCP fault matrix under race detection
        run: >-
          go test -race -count=1 -timeout=3m -v
          ./transport/tcp -run '^TestTCPFault'
          | tee tcp-fault-race.log

      - name: Shut down one thousand real TCP connections
        env:
          KPRO_TCP_STRESS_CONNECTIONS: "1000"
        run: >-
          go test -count=1 -timeout=3m -v
          ./transport/tcp -run '^TestTCPStressShutdownThousandsOfConnections$'
          | tee tcp-thousand-connections.log

      - name: Run two-minute real TCP soak
        env:
          KPRO_TCP_SOAK_DURATION: 2m
          KPRO_TCP_SOAK_CLIENTS: "64"
          KPRO_TCP_SOAK_PAYLOAD_BYTES: "256"
        run: >-
          go test -count=1 -timeout=5m -v
          ./transport/tcp -run '^TestTCPSoakEchoStability$'
          | tee tcp-soak.log

      - name: Upload resilience evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transport-resilience
          path: |
            tcp-fault-race.log
            tcp-thousand-connections.log
            tcp-soak.log
          if-no-files-found: ignore
