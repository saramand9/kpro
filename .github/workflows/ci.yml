name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify module checksums
        run: |
          go mod verify
          go mod tidy -diff

      - name: Verify publishable module metadata
        run: |
          if grep -En '^[[:space:]]*(replace|exclude)([[:space:]]|$)' go.mod; then
            echo "::error file=go.mod::published module must not contain replace or exclude directives"
            exit 1
          fi

      - name: Compile root module without cgo
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -run '^$' ./...

      - name: Test pure-Go SQLite paths
        env:
          CGO_ENABLED: "0"
        run: >-
          go test -count=1
          ./database/gorm
          ./eventing/delivery
          ./internal/app/persistence
          ./cmd/app

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Test root module
        run: go test -count=1 ./...

      - name: Vet root module
        run: go vet ./...

      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Enforce coverage floor
        run: |
          go test -count=1 -coverprofile=coverage.out ./core ./server ./middleware ./codec ./transport/... ./observability/... ./eventing/... ./database/... ./cmd/kpro ./cmd/benchguard
          go tool cover -func=coverage.out | tee coverage-summary.txt
          awk '/total:/ { gsub("%", "", $3); if ($3 + 0 < 55) { print "coverage below 55%: " $3 "%"; exit 1 } }' coverage-summary.txt

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: ignore

      - name: Generate a minimal service scaffold
        run: go run ./cmd/kpro new "${RUNNER_TEMP}/kpro-scaffold-minimal" --module example.com/kpro-scaffold-minimal --name scaffold-minimal --profile minimal

      - name: Compile generated minimal scaffold
        working-directory: ${{ runner.temp }}/kpro-scaffold-minimal
        run: |
          go mod tidy
          go test -count=1 ./...

      - name: Install pinned protobuf generation tools
        env:
          PROTOC_VERSION: "35.0"
          PROTOC_SHA256: a45cda0989c17dd950db55f6fbe1e5814c50fda08e87aa422980ac1f89dddbbc
          PROTOC_GEN_GO_VERSION: v1.36.11
          PROTOC_GEN_GO_GRPC_VERSION: v1.6.2
        run: |
          archive="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          install_dir="${RUNNER_TEMP}/protoc-${PROTOC_VERSION}"
          plugin_dir="${RUNNER_TEMP}/protoc-go-plugins"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  ${archive}" | sha256sum --check -
          unzip -q "$archive" -d "$install_dir"
          mkdir -p "$plugin_dir"
          GOBIN="$plugin_dir" go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          GOBIN="$plugin_dir" go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "${install_dir}/bin" >> "$GITHUB_PATH"
          echo "$plugin_dir" >> "$GITHUB_PATH"
          "${install_dir}/bin/protoc" --version
          "${plugin_dir}/protoc-gen-go" --version
          "${plugin_dir}/protoc-gen-go-grpc" --version

      - name: Add gRPC to an existing HTTP service
        run: |
          target="${RUNNER_TEMP}/kpro-add-grpc"
          go run ./cmd/kpro new "$target" \
            --module example.com/kpro-add-grpc \
            --name addgrpc \
            --profile service \
            --api http

          main_file="$target/cmd/addgrpc/main.go"
          main_before="$(sha256sum "$main_file" | awk '{print $1}')"

          go run ./cmd/kpro add --root "$target" --api grpc

          main_after="$(sha256sum "$main_file" | awk '{print $1}')"
          test "$main_before" = "$main_after"

          tree_digest() {
            (
              cd "$target"
              find . -type f -printf '%P %m\n' | LC_ALL=C sort
              find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
            ) | sha256sum | awk '{print $1}'
          }

          first_add="$(tree_digest)"
          go run ./cmd/kpro add --root "$target" --api grpc
          second_add="$(tree_digest)"
          test "$first_add" = "$second_add"

          go -C "$target" mod tidy
          go -C "$target" test -count=1 ./...
          go run ./cmd/kpro generate --root "$target" --check

      - name: Generate and check a multi-API service scaffold
        run: |
          target="${RUNNER_TEMP}/kpro-scaffold-service"
          go run ./cmd/kpro new "$target" \
            --module example.com/kpro-scaffold-service \
            --name scaffold-service \
            --profile service \
            --api http \
            --api grpc \
            --api message \
            --transport tcp \
            --transport kcp \
            --transport quic \
            --transport udp \
            --transport websocket
          go run ./cmd/kpro generate --root "$target" --check

      - name: Compile generated multi-API service scaffold
        working-directory: ${{ runner.temp }}/kpro-scaffold-service
        run: |
          go mod tidy
          go test -count=1 ./...

      - name: Race test root module
        run: go test -race -count=1 ./...

      - name: Guard hot-path performance budgets
        run: |
          go test -p 1 ./core ./transport/httpx ./transport/internal/outbound ./transport/internal/dispatchgate ./benchmark -run '^$' -bench 'Benchmark(RouterDispatchSync|EndpointServeHTTP|OutboundQueueRoundTrip|GateBeginEnd|KProCodec)$' -benchmem -benchtime=250ms -count=3 > benchmark-current.txt
          cat benchmark-current.txt
          go run ./cmd/benchguard -budget benchmark/budgets.json -input benchmark-current.txt

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hot-path-benchmarks
          path: benchmark-current.txt
          if-no-files-found: ignore

      - name: Test benchmark compare module
        working-directory: benchmark/compare
        run: go test -count=1 ./...

      - name: Vet benchmark compare module
        working-directory: benchmark/compare
        run: go vet ./...

  database-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kpro
          MYSQL_USER: kpro
          MYSQL_PASSWORD: kpro
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ukpro -pkpro"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kpro
          POSTGRES_USER: kpro
          POSTGRES_PASSWORD: kpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kpro -d kpro"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true

      - name: Test SQL database integrations
        env:
          KPRO_REQUIRE_EXTERNAL_DB: "1"
          KPRO_TEST_MYSQL_DSN: kpro:kpro@tcp(127.0.0.1:3306)/kpro?parseTime=true
          KPRO_TEST_POSTGRES_DSN: postgres://kpro:kpro@127.0.0.1:5432/kpro?sslmode=disable
        run: go test -count=1 -tags dbintegration ./database/... ./eventing/delivery

  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true

      - name: Test Windows core and developer tooling
        run: go test -count=1 ./core ./server ./transport/... ./cmd/kpro ./examples/...

      - name: Install pinned protobuf generation tools
        shell: pwsh
        env:
          PROTOC_VERSION: "35.0"
          PROTOC_SHA256: d1cede9e308cc3eb072392af1c02ccae4bdd3d2f374ec2970dbd8cdfdaa91363
          PROTOC_GEN_GO_VERSION: v1.36.11
          PROTOC_GEN_GO_GRPC_VERSION: v1.6.2
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "protoc-$env:PROTOC_VERSION-win64.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "protoc-$env:PROTOC_VERSION"
          $pluginDir = Join-Path $env:RUNNER_TEMP 'protoc-go-plugins'
          curl.exe --fail --location --retry 3 --output $archive `
            "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'failed to download protoc' }
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:PROTOC_SHA256) {
            throw "protoc checksum mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir
          New-Item -ItemType Directory -Path $pluginDir | Out-Null
          $env:GOBIN = $pluginDir
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@$env:PROTOC_GEN_GO_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'failed to install protoc-gen-go' }
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@$env:PROTOC_GEN_GO_GRPC_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'failed to install protoc-gen-go-grpc' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $installDir 'bin')
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $pluginDir
          & (Join-Path $installDir 'bin/protoc.exe') --version
          & (Join-Path $pluginDir 'protoc-gen-go.exe') --version
          & (Join-Path $pluginDir 'protoc-gen-go-grpc.exe') --version

      - name: Add gRPC to an existing HTTP service
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'kpro-add-grpc'
          go run ./cmd/kpro new $target `
            --module example.com/kpro-add-grpc `
            --name addgrpc `
            --profile service `
            --api http

          $mainFile = Join-Path $target 'cmd/addgrpc/main.go'
          $mainBefore = (Get-FileHash -Algorithm SHA256 $mainFile).Hash

          go run ./cmd/kpro add --root $target --api grpc

          $mainAfter = (Get-FileHash -Algorithm SHA256 $mainFile).Hash
          if ($mainBefore -ne $mainAfter) { throw 'add rewrote the application main file' }

          function Get-TreeSnapshot {
            Get-ChildItem -LiteralPath $target -Recurse -File |
              Sort-Object FullName |
              ForEach-Object {
                $relative = [System.IO.Path]::GetRelativePath($target, $_.FullName).Replace('\', '/')
                $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
                "$relative`t$hash"
              }
          }

          $firstAdd = @(Get-TreeSnapshot)
          go run ./cmd/kpro add --root $target --api grpc
          $secondAdd = @(Get-TreeSnapshot)
          $delta = @(Compare-Object -ReferenceObject $firstAdd -DifferenceObject $secondAdd)
          if ($delta.Count -ne 0) {
            $delta | Format-Table | Out-String | Write-Host
            throw 'second add changed the project tree'
          }

          Push-Location $target
          try {
            go mod tidy
            go test -count=1 ./...
          } finally {
            Pop-Location
          }
          go run ./cmd/kpro generate --root $target --check

      - name: Generate and compile a minimal service
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'kpro-scaffold-minimal'
          go run ./cmd/kpro new $target --module example.com/kpro-scaffold-minimal --name scaffold-minimal --profile minimal
          Push-Location $target
          go mod tidy
          go test -count=1 ./...
          Pop-Location

      - name: Generate, check, and compile an HTTP and message service
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'kpro-scaffold-service'
          go run ./cmd/kpro new $target `
            --module example.com/kpro-scaffold-service `
            --name scaffold-service `
            --profile service `
            --api http `
            --api message `
            --transport tcp `
            --transport websocket
          go run ./cmd/kpro generate --root $target --check
          Push-Location $target
          go mod tidy
          go test -count=1 ./...
          Pop-Location

  go-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.12", "1.26.5"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify supported Go version
        run: |
          go version
          go mod verify
          go test -count=1 ./core ./server ./middleware ./codec ./transport/...
