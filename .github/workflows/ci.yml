name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify module checksums
        run: |
          go mod verify
          go mod tidy -diff

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Test root module
        run: go test -count=1 ./...

      - name: Vet root module
        run: go vet ./...

      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Enforce coverage floor
        run: |
          go test -count=1 -coverprofile=coverage.out ./core ./server ./middleware ./codec ./transport/... ./observability/... ./eventing/... ./database/... ./cmd/kpro ./cmd/benchguard
          go tool cover -func=coverage.out | tee coverage-summary.txt
          awk '/total:/ { gsub("%", "", $3); if ($3 + 0 < 55) { print "coverage below 55%: " $3 "%"; exit 1 } }' coverage-summary.txt

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: ignore

      - name: Generate a service scaffold
        run: go run ./cmd/kpro new "${RUNNER_TEMP}/kpro-scaffold-smoke" --module example.com/kpro-scaffold-smoke --name scaffold-smoke

      - name: Compile generated service scaffold
        working-directory: ${{ runner.temp }}/kpro-scaffold-smoke
        run: |
          go mod tidy
          go test -count=1 ./...

      - name: Race test root module
        run: go test -race -count=1 ./...

      - name: Guard hot-path performance budgets
        run: |
          go test ./core ./transport/httpx -run '^$' -bench 'Benchmark(RouterDispatchSync|EndpointServeHTTP)$' -benchmem -benchtime=250ms -count=1 > benchmark-current.txt
          cat benchmark-current.txt
          go run ./cmd/benchguard -budget benchmark/budgets.json -input benchmark-current.txt

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hot-path-benchmarks
          path: benchmark-current.txt
          if-no-files-found: ignore

      - name: Test benchmark compare module
        working-directory: benchmark/compare
        run: go test -count=1 ./...

      - name: Vet benchmark compare module
        working-directory: benchmark/compare
        run: go vet ./...

  database-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kpro
          MYSQL_USER: kpro
          MYSQL_PASSWORD: kpro
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ukpro -pkpro"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kpro
          POSTGRES_USER: kpro
          POSTGRES_PASSWORD: kpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kpro -d kpro"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Test SQL database integrations
        env:
          KPRO_REQUIRE_EXTERNAL_DB: "1"
          KPRO_TEST_MYSQL_DSN: kpro:kpro@tcp(127.0.0.1:3306)/kpro?parseTime=true
          KPRO_TEST_POSTGRES_DSN: postgres://kpro:kpro@127.0.0.1:5432/kpro?sslmode=disable
        run: go test -count=1 -tags dbintegration ./database/... ./eventing/delivery

  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Test Windows core and developer tooling
        run: go test -count=1 ./core ./server ./transport/... ./cmd/kpro ./examples/...

      - name: Generate and compile a service
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'kpro-scaffold-smoke'
          go run ./cmd/kpro new $target --module example.com/kpro-scaffold-smoke --name scaffold-smoke
          Push-Location $target
          go mod tidy
          go test -count=1 ./...
          Pop-Location

  go-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.12", "1.26.5"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify supported Go version
        run: |
          go version
          go mod verify
          go test -count=1 ./core ./server ./middleware ./codec ./transport/...
