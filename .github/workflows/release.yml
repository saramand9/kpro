name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true

      - name: Validate semantic release tag
        run: |
          go test ./.github/scripts
          go run ./.github/scripts/releasecheck.go validate-tag --tag "${GITHUB_REF_NAME}"
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "${notes_file}" ]; then
            echo "release notes are missing or empty: ${notes_file}"
            exit 1
          fi

      - name: Verify tag commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag_type="$(git cat-file -t "${GITHUB_REF_NAME}")"
          if [ "${tag_type}" != "tag" ]; then
            echo "${GITHUB_REF_NAME} must be an annotated tag"
            exit 1
          fi
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${checkout_commit}" ]; then
            echo "tag commit ${tag_commit} does not match checkout ${checkout_commit}"
            exit 1
          fi
          git fetch --no-tags origin \
            "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor \
            "${tag_commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "tag commit ${tag_commit} is not on ${DEFAULT_BRANCH}"
            exit 1
          fi

  verify:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify release source
        run: |
          go mod verify
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Install pinned Syft for release SBOMs
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.49.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          "$(go env GOPATH)/bin/syft" version

      - name: Create checksummed draft release and SBOMs
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release artifact matrix and metadata
        run: |
          go run ./.github/scripts/releasecheck.go verify-artifacts \
            --dist dist \
            --tag "${GITHUB_REF_NAME}" \
            --commit "$(git rev-parse HEAD)"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --draft=false \
            --verify-tag
