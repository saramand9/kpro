<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" role="img" aria-labelledby="title desc">
  <title id="title">KPro WebSocket Internal Flow</title>
  <desc id="desc">Detailed WebSocket call flow for KPro universal server, covering endpoint setup, HTTP upgrade, hijacked sessions, WebSocket frame parsing, KProV1 packet decoding, router dispatch, response writes, and shutdown.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2e3745" />
    </marker>
    <marker id="warnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#a05a00" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.14" />
    </filter>
    <style>
      .bg { fill: #f7f4ef; }
      .title { font: 700 38px "Microsoft YaHei", Arial, sans-serif; fill: #202631; }
      .subtitle { font: 400 18px "Microsoft YaHei", Arial, sans-serif; fill: #536070; }
      .laneTitle { font: 700 17px "Microsoft YaHei", Arial, sans-serif; fill: #566171; }
      .boxTitle { font: 700 18px "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .text { font: 400 14px "Microsoft YaHei", Arial, sans-serif; fill: #4f5a68; }
      .small { font: 400 12px "Microsoft YaHei", Arial, sans-serif; fill: #647084; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .setup { fill: #fff8e6; stroke: #d9a529; }
      .ws { fill: #e8f4fb; stroke: #3182bd; }
      .frame { fill: #e8f7f1; stroke: #2f8f83; }
      .proto { fill: #fff3d6; stroke: #c98918; }
      .router { fill: #eef0ff; stroke: #6870c9; }
      .app { fill: #eaf6df; stroke: #68a746; }
      .risk { fill: #fff2ed; stroke: #d47452; }
      .note { fill: #ffffff; stroke: #d8c7aa; }
      .line { fill: none; stroke: #2e3745; stroke-width: 2.3; marker-end: url(#arrow); }
      .lineThin { fill: none; stroke: #667085; stroke-width: 1.8; marker-end: url(#arrow); }
      .warn { fill: none; stroke: #a05a00; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#warnArrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1320" />
  <text class="title" x="54" y="64">KPro WebSocket Call Flow and Internal Design</text>
  <text class="subtitle" x="54" y="96">transport/websocket owns HTTP upgrade and WebSocket frames; protocol.KProV1 owns message payload decoding; core.Router owns dispatch; core.Invocation + core.Middleware run at handler execution time.</text>

  <rect x="40" y="126" width="1820" height="172" rx="14" fill="#f0e7d8" stroke="#dbc7a5" />
  <text class="laneTitle" x="64" y="154">1. User API and endpoint assembly</text>

  <rect class="box setup" x="70" y="190" width="250" height="78" rx="8" />
  <text class="boxTitle" x="102" y="222">server.New(config)</text>
  <text class="text" x="96" y="246">stores RouterConfig</text>

  <rect class="box setup" x="380" y="190" width="270" height="78" rx="8" />
  <text class="boxTitle" x="420" y="222">app.WebSocket</text>
  <text class="text" x="416" y="246">sets addr and path</text>

  <rect class="box setup" x="710" y="190" width="286" height="78" rx="8" />
  <text class="boxTitle" x="768" y="222">server.Mount</text>
  <text class="text" x="738" y="246">websocket.Server + core.Router</text>

  <rect class="box setup" x="1056" y="190" width="292" height="78" rx="8" />
  <text class="boxTitle" x="1118" y="222">Use / Handle</text>
  <text class="text" x="1092" y="246">core.Middleware + msgID route</text>

  <rect class="box setup" x="1408" y="190" width="306" height="78" rx="8" />
  <text class="boxTitle" x="1464" y="222">ListenAndServe</text>
  <text class="text" x="1436" y="246">go endpoint.ListenAndServe(ctx)</text>

  <path class="line" d="M320 229 L370 229" />
  <path class="line" d="M650 229 L700 229" />
  <path class="line" d="M996 229 L1046 229" />
  <path class="line" d="M1348 229 L1398 229" />

  <rect x="40" y="330" width="1820" height="318" rx="14" fill="#e8f4fb" stroke="#bfd5e6" />
  <text class="laneTitle" x="64" y="358">2. WebSocket transport: HTTP server, upgrade, hijack, session, reader and writer goroutines</text>

  <rect class="box ws" x="70" y="400" width="250" height="94" rx="8" />
  <text class="boxTitle" x="108" y="432">ws.ListenAndServe</text>
  <text class="text" x="98" y="456">http.Server on Addr</text>
  <text class="text" x="98" y="478">mux handles configured Path</text>

  <rect class="box ws" x="380" y="400" width="244" height="94" rx="8" />
  <text class="boxTitle" x="450" y="432">serveWS</text>
  <text class="text" x="412" y="456">check Upgrade headers</text>
  <text class="text" x="412" y="478">check Sec-WebSocket-Version</text>

  <rect class="box ws" x="684" y="400" width="286" height="94" rx="8" />
  <text class="boxTitle" x="748" y="432">Hijack conn</text>
  <text class="text" x="714" y="456">take net.Conn from HTTP</text>
  <text class="text" x="714" y="478">write 101 Switching Protocols</text>

  <rect class="box ws" x="1030" y="400" width="292" height="94" rx="8" />
  <text class="boxTitle" x="1088" y="432">websocket.session</text>
  <text class="text" x="1060" y="456">id / raw net.Conn / reader</text>
  <text class="text" x="1060" y="478">sendQueue / done / closeOnce</text>

  <rect class="box ws" x="1382" y="384" width="360" height="126" rx="8" />
  <text class="boxTitle" x="1470" y="418">session.start</text>
  <text class="text" x="1416" y="444">go readLoop(handler)</text>
  <text class="text" x="1416" y="466">go writeLoop()</text>
  <text class="small" x="1416" y="488">one upgraded connection owns one reader and one writer</text>

  <path class="line" d="M320 447 L370 447" />
  <path class="line" d="M624 447 L674 447" />
  <path class="line" d="M970 447 L1020 447" />
  <path class="line" d="M1322 447 L1372 447" />

  <rect class="box note" x="70" y="548" width="560" height="62" rx="8" />
  <text class="boxTitle" x="98" y="578">Close / Shutdown boundary</text>
  <text class="text" x="302" y="578">Close: close(done), raw.Close, sessions.Delete</text>
  <text class="text" x="302" y="600">Shutdown: close all sessions, then http.Server.Shutdown</text>

  <rect class="box note" x="690" y="548" width="610" height="62" rx="8" />
  <text class="boxTitle" x="718" y="578">Default resource boundary</text>
  <text class="text" x="900" y="578">Path=/ws, MaxMessage=64KB, SendQueueSize=64</text>
  <text class="text" x="900" y="600">ReadTimeout=90s, WriteTimeout=5s</text>

  <rect x="40" y="682" width="1820" height="244" rx="14" fill="#e8f7f1" stroke="#b9d9cd" />
  <text class="laneTitle" x="64" y="710">3. Inbound read: WebSocket frame parsing, message reassembly, and KProV1 packet decoding</text>

  <rect class="box frame" x="70" y="762" width="250" height="92" rx="8" />
  <text class="boxTitle" x="132" y="794">readLoop</text>
  <text class="text" x="104" y="818">SetReadDeadline</text>
  <text class="text" x="104" y="840">loop over WebSocket frames</text>

  <rect class="box frame" x="380" y="750" width="330" height="116" rx="8" />
  <text class="boxTitle" x="486" y="782">readFrame</text>
  <text class="text" x="412" y="808">parse FIN, opcode, length</text>
  <text class="text" x="412" y="830">read mask and payload</text>
  <text class="text" x="412" y="852">unmask client payload</text>

  <rect class="box frame" x="770" y="750" width="330" height="116" rx="8" />
  <text class="boxTitle" x="848" y="782">opcode handling</text>
  <text class="text" x="808" y="808">Ping -> Pong, Close -> Close</text>
  <text class="text" x="808" y="830">Text/Binary -> message payload</text>
  <text class="text" x="808" y="852">Continuation -> append fragments</text>

  <rect class="box proto" x="1160" y="750" width="270" height="116" rx="8" />
  <text class="boxTitle" x="1210" y="782">DecodePacket</text>
  <text class="text" x="1192" y="808">KProV1 in WS payload</text>
  <text class="text" x="1192" y="830">20-byte header + body</text>
  <text class="small" x="1192" y="852">bad packet closes session</text>

  <rect class="box router" x="1490" y="750" width="300" height="116" rx="8" />
  <text class="boxTitle" x="1564" y="782">AcquireContext</text>
  <text class="text" x="1522" y="808">session + core.Message</text>
  <text class="text" x="1522" y="830">Reply / Error -> session.Send</text>
  <text class="text" x="1522" y="852">handler = router.Dispatch</text>

  <path class="line" d="M320 808 L370 808" />
  <path class="line" d="M710 808 L760 808" />
  <path class="line" d="M1100 808 L1150 808" />
  <path class="line" d="M1430 808 L1480 808" />

  <rect class="box risk" x="1160" y="884" width="270" height="62" rx="8" />
  <text class="boxTitle" x="1210" y="914">Heartbeat</text>
  <text class="text" x="1192" y="936">MsgHeartbeat -> Send MsgPong, bypass Router</text>
  <path class="warn" d="M1295 866 L1295 884" />

  <rect x="40" y="960" width="1820" height="258" rx="14" fill="#eef0ff" stroke="#c9cef8" />
  <text class="laneTitle" x="64" y="988">4. Router dispatch, Invocation middleware, response packet encoding, and WebSocket binary writeback</text>

  <rect class="box router" x="70" y="1032" width="244" height="118" rx="8" />
  <text class="boxTitle" x="120" y="1064">Router.Dispatch</text>
  <text class="text" x="98" y="1090">routes[msg.ID]</text>
  <text class="text" x="98" y="1112">missing handler -> ctx.Error</text>
  <text class="small" x="98" y="1134">snapshot middlewares</text>

  <rect class="box router" x="374" y="1032" width="260" height="118" rx="8" />
  <text class="boxTitle" x="430" y="1064">dispatchTask</text>
  <text class="text" x="410" y="1090">ctx + handler</text>
  <text class="text" x="410" y="1112">middlewares snapshot</text>
  <text class="small" x="410" y="1134">enter sync / async dispatch</text>

  <rect class="box router" x="694" y="1008" width="300" height="100" rx="8" />
  <text class="boxTitle" x="764" y="1040">HandleSync default</text>
  <text class="text" x="728" y="1066">sessionExecutor.queue</text>
  <text class="text" x="728" y="1088">serial order + inflight limit</text>

  <rect class="box router" x="694" y="1130" width="300" height="70" rx="8" />
  <text class="boxTitle" x="766" y="1160">HandleAsync</text>
  <text class="text" x="728" y="1184">asyncQueue + backpressure</text>

  <rect class="box risk" x="1054" y="1032" width="296" height="118" rx="8" />
  <text class="boxTitle" x="1110" y="1064">core.Invocation</text>
  <text class="text" x="1088" y="1090">NewMessageInvocation</text>
  <text class="text" x="1088" y="1112">core.Middleware chain</text>
  <text class="small" x="1088" y="1134">at execute, before handler</text>

  <rect class="box app" x="1410" y="1032" width="270" height="118" rx="8" />
  <text class="boxTitle" x="1472" y="1064">Business Handler</text>
  <text class="text" x="1440" y="1090">ctx.Message()</text>
  <text class="text" x="1440" y="1112">ctx.Reply(id, data)</text>
  <text class="small" x="1440" y="1134">panic / error -> ctx.Error</text>

  <path class="line" d="M314 1091 L364 1091" />
  <path class="line" d="M634 1091 L684 1060" />
  <path class="lineThin" d="M634 1091 L684 1165" />
  <path class="line" d="M994 1060 L1044 1091" />
  <path class="lineThin" d="M994 1165 L1044 1091" />
  <path class="line" d="M1350 1091 L1400 1091" />

  <rect class="box ws" x="70" y="1240" width="320" height="58" rx="8" />
  <text class="boxTitle" x="96" y="1276">session.Send</text>
  <text class="text" x="222" y="1276">EncodePacket -> sendQueue</text>

  <rect class="box proto" x="450" y="1240" width="300" height="58" rx="8" />
  <text class="boxTitle" x="480" y="1276">KProV1.EncodePacket</text>
  <text class="text" x="660" y="1276">message payload</text>

  <rect class="box ws" x="810" y="1240" width="300" height="58" rx="8" />
  <text class="boxTitle" x="842" y="1276">sendQueue</text>
  <text class="text" x="954" y="1276">full -> Close</text>

  <rect class="box ws" x="1170" y="1240" width="300" height="58" rx="8" />
  <text class="boxTitle" x="1202" y="1276">writeLoop</text>
  <text class="text" x="1312" y="1276">SetWriteDeadline</text>

  <rect class="box frame" x="1530" y="1240" width="300" height="58" rx="8" />
  <text class="boxTitle" x="1560" y="1276">writeFrame</text>
  <text class="text" x="1674" y="1276">binary WS frame</text>

  <path class="line" d="M1545 1150 C1545 1200, 230 1200, 230 1230" />
  <path class="line" d="M390 1269 L440 1269" />
  <path class="line" d="M750 1269 L800 1269" />
  <path class="line" d="M1110 1269 L1160 1269" />
  <path class="line" d="M1470 1269 L1520 1269" />

  <rect class="box note" x="1240" y="1010" width="324" height="48" rx="8" />
  <text class="small" x="1260" y="1038">Different WebSocket connections have different sessionExecutors.</text>

  <rect class="box note" x="1240" y="1164" width="324" height="48" rx="8" />
  <text class="small" x="1260" y="1192">WebSocket message payload is one KProV1 packet after reassembly.</text>
</svg>
