<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" role="img" aria-labelledby="title desc">
  <title id="title">KPro TCP Internal Flow</title>
  <desc id="desc">Detailed TCP call flow for KPro universal server, covering endpoint setup, TCP sessions, KProV1 framing, router dispatch, sync and async execution, response writes, backpressure, and shutdown.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2e3745" />
    </marker>
    <marker id="warnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#a05a00" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.14" />
    </filter>
    <style>
      .bg { fill: #f7f4ef; }
      .title { font: 700 38px "Microsoft YaHei", Arial, sans-serif; fill: #202631; }
      .subtitle { font: 400 18px "Microsoft YaHei", Arial, sans-serif; fill: #536070; }
      .laneTitle { font: 700 17px "Microsoft YaHei", Arial, sans-serif; fill: #566171; }
      .boxTitle { font: 700 18px "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .text { font: 400 14px "Microsoft YaHei", Arial, sans-serif; fill: #4f5a68; }
      .small { font: 400 12px "Microsoft YaHei", Arial, sans-serif; fill: #647084; }
      .tiny { font: 400 11px "Microsoft YaHei", Arial, sans-serif; fill: #687386; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .setup { fill: #fff8e6; stroke: #d9a529; }
      .tcp { fill: #e9f4f1; stroke: #2f8f83; }
      .proto { fill: #fff3d6; stroke: #c98918; }
      .router { fill: #eef0ff; stroke: #6870c9; }
      .app { fill: #eaf6df; stroke: #68a746; }
      .risk { fill: #fff2ed; stroke: #d47452; }
      .note { fill: #ffffff; stroke: #d8c7aa; }
      .line { fill: none; stroke: #2e3745; stroke-width: 2.3; marker-end: url(#arrow); }
      .lineThin { fill: none; stroke: #667085; stroke-width: 1.8; marker-end: url(#arrow); }
      .warn { fill: none; stroke: #a05a00; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#warnArrow); }
      .dash { fill: none; stroke: #667085; stroke-width: 1.6; stroke-dasharray: 6 7; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1320" />
  <text class="title" x="54" y="64">KPro TCP 调用流程与内部设计</text>
  <text class="subtitle" x="54" y="96">基于 universal server 路径：transport/tcp 负责连接与字节流，protocol.KProV1 负责帧解析，core.Router 负责调度，core.Invocation + core.Middleware 在 handler 执行点运行。</text>

  <rect x="40" y="126" width="1820" height="172" rx="14" fill="#f0e7d8" stroke="#dbc7a5" />
  <text class="laneTitle" x="64" y="154">1. 用户 API 与 endpoint 装配</text>

  <rect class="box setup" x="70" y="190" width="250" height="78" rx="8" />
  <text class="boxTitle" x="102" y="222">server.New(config)</text>
  <text class="text" x="96" y="246">保存 RouterConfig</text>

  <rect class="box setup" x="380" y="190" width="270" height="78" rx="8" />
  <text class="boxTitle" x="430" y="222">app.TCP(addr, cfg)</text>
  <text class="text" x="416" y="246">cfg.Addr = addr</text>

  <rect class="box setup" x="710" y="190" width="286" height="78" rx="8" />
  <text class="boxTitle" x="768" y="222">server.Mount</text>
  <text class="text" x="738" y="246">transport/tcp + core.Router</text>

  <rect class="box setup" x="1056" y="190" width="292" height="78" rx="8" />
  <text class="boxTitle" x="1118" y="222">Use / Handle</text>
  <text class="text" x="1092" y="246">core.Middleware + msgID route</text>

  <rect class="box setup" x="1408" y="190" width="306" height="78" rx="8" />
  <text class="boxTitle" x="1464" y="222">ListenAndServe</text>
  <text class="text" x="1436" y="246">go endpoint.ListenAndServe(ctx)</text>

  <path class="line" d="M320 229 L370 229" />
  <path class="line" d="M650 229 L700 229" />
  <path class="line" d="M996 229 L1046 229" />
  <path class="line" d="M1348 229 L1398 229" />

  <rect x="40" y="330" width="1820" height="318" rx="14" fill="#eaf4f0" stroke="#c3d9cf" />
  <text class="laneTitle" x="64" y="358">2. TCP transport：监听、连接、session 与读写 goroutine</text>

  <rect class="box tcp" x="70" y="400" width="250" height="94" rx="8" />
  <text class="boxTitle" x="112" y="432">tcp.ListenAndServe</text>
  <text class="text" x="98" y="456">net.Listen("tcp", Addr)</text>
  <text class="text" x="98" y="478">ctx.Done -> ln.Close</text>

  <rect class="box tcp" x="380" y="400" width="234" height="94" rx="8" />
  <text class="boxTitle" x="450" y="432">Accept</text>
  <text class="text" x="412" y="456">检查 MaxConnections</text>
  <text class="text" x="412" y="478">超限直接 raw.Close</text>

  <rect class="box tcp" x="674" y="400" width="292" height="94" rx="8" />
  <text class="boxTitle" x="726" y="432">创建 tcp.session</text>
  <text class="text" x="704" y="456">id / raw net.Conn</text>
  <text class="text" x="704" y="478">sendQueue / done / closeOnce</text>

  <rect class="box tcp" x="1026" y="400" width="290" height="94" rx="8" />
  <text class="boxTitle" x="1090" y="432">注册 active session</text>
  <text class="text" x="1056" y="456">active++</text>
  <text class="text" x="1056" y="478">sessions.Store(id, session)</text>

  <rect class="box tcp" x="1376" y="384" width="360" height="126" rx="8" />
  <text class="boxTitle" x="1464" y="418">session.start</text>
  <text class="text" x="1410" y="444">go readLoop(handler)</text>
  <text class="text" x="1410" y="466">go writeLoop()</text>
  <text class="small" x="1410" y="488">一个连接两个 transport goroutine</text>

  <path class="line" d="M320 447 L370 447" />
  <path class="line" d="M614 447 L664 447" />
  <path class="line" d="M966 447 L1016 447" />
  <path class="line" d="M1316 447 L1366 447" />

  <rect class="box note" x="70" y="548" width="520" height="62" rx="8" />
  <text class="boxTitle" x="98" y="578">Close / Shutdown 边界</text>
  <text class="text" x="278" y="578">Close: close(done), raw.Close, sessions.Delete, active--</text>
  <text class="text" x="278" y="600">Shutdown: ln.Close + 关闭所有 session</text>

  <rect class="box note" x="650" y="548" width="610" height="62" rx="8" />
  <text class="boxTitle" x="678" y="578">默认资源边界</text>
  <text class="text" x="820" y="578">MaxFrameSize=64KB, MaxConnections=10000, SendQueueSize=64</text>
  <text class="text" x="820" y="600">ReadTimeout=90s, WriteTimeout=5s</text>

  <rect x="40" y="682" width="1820" height="244" rx="14" fill="#fff7e4" stroke="#e0c77c" />
  <text class="laneTitle" x="64" y="710">3. 入站读取与 KProV1 协议解码</text>

  <rect class="box tcp" x="70" y="762" width="250" height="92" rx="8" />
  <text class="boxTitle" x="132" y="794">readLoop</text>
  <text class="text" x="104" y="818">SetReadDeadline</text>
  <text class="text" x="104" y="840">循环读取 TCP 字节流</text>

  <rect class="box proto" x="380" y="750" width="330" height="116" rx="8" />
  <text class="boxTitle" x="474" y="782">Protocol.Read</text>
  <text class="text" x="412" y="808">io.ReadFull 20-byte header</text>
  <text class="text" x="412" y="830">校验 magic/version/body length</text>
  <text class="text" x="412" y="852">再读取 body</text>

  <rect class="box proto" x="770" y="750" width="330" height="116" rx="8" />
  <text class="boxTitle" x="858" y="782">core.Message</text>
  <text class="text" x="808" y="808">ID: msgID 路由键</text>
  <text class="text" x="808" y="830">Seq: 请求/响应关联</text>
  <text class="text" x="808" y="852">Flags + Data</text>

  <rect class="box risk" x="1160" y="750" width="270" height="116" rx="8" />
  <text class="boxTitle" x="1232" y="782">Heartbeat</text>
  <text class="text" x="1192" y="808">MsgHeartbeat?</text>
  <text class="text" x="1192" y="830">直接 Send MsgPong</text>
  <text class="small" x="1192" y="852">不进入 Router</text>

  <rect class="box router" x="1490" y="750" width="300" height="116" rx="8" />
  <text class="boxTitle" x="1564" y="782">AcquireContext</text>
  <text class="text" x="1522" y="808">session + message</text>
  <text class="text" x="1522" y="830">Reply / Error -> session.Send</text>
  <text class="text" x="1522" y="852">handler = router.Dispatch</text>

  <path class="line" d="M320 808 L370 808" />
  <path class="line" d="M710 808 L760 808" />
  <path class="line" d="M1100 808 L1150 808" />
  <path class="line" d="M1430 808 L1480 808" />
  <path class="warn" d="M1295 866 C1295 930, 1680 930, 1680 1030" />

  <rect x="40" y="960" width="1820" height="258" rx="14" fill="#eef0ff" stroke="#c9cef8" />
  <text class="laneTitle" x="64" y="988">4. Router 调度、Invocation、中间件执行与回写</text>

  <rect class="box router" x="70" y="1032" width="244" height="118" rx="8" />
  <text class="boxTitle" x="120" y="1064">Router.Dispatch</text>
  <text class="text" x="98" y="1090">routes[msg.ID]</text>
  <text class="text" x="98" y="1112">没有 handler -> ctx.Error</text>
  <text class="small" x="98" y="1134">snapshot middlewares</text>

  <rect class="box router" x="374" y="1032" width="260" height="118" rx="8" />
  <text class="boxTitle" x="430" y="1064">dispatchTask</text>
  <text class="text" x="410" y="1090">ctx + handler</text>
  <text class="text" x="410" y="1112">middlewares snapshot</text>
  <text class="small" x="410" y="1134">进入 sync / async 调度</text>

  <rect class="box router" x="694" y="1008" width="300" height="100" rx="8" />
  <text class="boxTitle" x="764" y="1040">HandleSync 默认</text>
  <text class="text" x="728" y="1066">sessionExecutor.queue</text>
  <text class="text" x="728" y="1088">串行保序 + inflight limit</text>

  <rect class="box router" x="694" y="1130" width="300" height="70" rx="8" />
  <text class="boxTitle" x="766" y="1160">HandleAsync</text>
  <text class="text" x="728" y="1184">asyncQueue + backpressure</text>

  <rect class="box risk" x="1054" y="1032" width="296" height="118" rx="8" />
  <text class="boxTitle" x="1110" y="1064">core.Invocation</text>
  <text class="text" x="1088" y="1090">NewMessageInvocation</text>
  <text class="text" x="1088" y="1112">core.Middleware chain</text>
  <text class="small" x="1088" y="1134">execute 时、handler 前</text>

  <rect class="box app" x="1410" y="1032" width="270" height="118" rx="8" />
  <text class="boxTitle" x="1472" y="1064">业务 Handler</text>
  <text class="text" x="1440" y="1090">ctx.Message()</text>
  <text class="text" x="1440" y="1112">ctx.Reply(id, data)</text>
  <text class="small" x="1440" y="1134">panic / error -> ctx.Error</text>

  <path class="line" d="M314 1091 L364 1091" />
  <path class="line" d="M634 1091 L684 1060" />
  <path class="lineThin" d="M634 1091 L684 1165" />
  <path class="line" d="M994 1060 L1044 1091" />
  <path class="lineThin" d="M994 1165 L1044 1091" />
  <path class="line" d="M1350 1091 L1400 1091" />

  <rect class="box tcp" x="70" y="1240" width="320" height="58" rx="8" />
  <text class="boxTitle" x="96" y="1276">session.Send</text>
  <text class="text" x="222" y="1276">Protocol.Encode -> sendQueue</text>

  <rect class="box proto" x="450" y="1240" width="300" height="58" rx="8" />
  <text class="boxTitle" x="480" y="1276">KProV1.Encode</text>
  <text class="text" x="622" y="1276">20-byte header + body</text>

  <rect class="box tcp" x="810" y="1240" width="300" height="58" rx="8" />
  <text class="boxTitle" x="842" y="1276">sendQueue</text>
  <text class="text" x="954" y="1276">满了 -> Close</text>

  <rect class="box tcp" x="1170" y="1240" width="300" height="58" rx="8" />
  <text class="boxTitle" x="1202" y="1276">writeLoop</text>
  <text class="text" x="1312" y="1276">SetWriteDeadline</text>

  <rect class="box tcp" x="1530" y="1240" width="300" height="58" rx="8" />
  <text class="boxTitle" x="1560" y="1276">writeFull</text>
  <text class="text" x="1674" y="1276">net.Conn.Write</text>

  <path class="line" d="M1545 1150 C1545 1200, 230 1200, 230 1230" />
  <path class="line" d="M390 1269 L440 1269" />
  <path class="line" d="M750 1269 L800 1269" />
  <path class="line" d="M1110 1269 L1160 1269" />
  <path class="line" d="M1470 1269 L1520 1269" />

  <rect class="box note" x="1240" y="1010" width="324" height="48" rx="8" />
  <text class="small" x="1260" y="1038">不同 TCP 连接：各自 sessionExecutor，可并行执行</text>

  <rect class="box note" x="1240" y="1164" width="324" height="48" rx="8" />
  <text class="small" x="1260" y="1192">AsyncWorkers=1 + HandleAsync 可让该 endpoint 全局串行</text>
</svg>
