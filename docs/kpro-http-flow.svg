<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1240" viewBox="0 0 1900 1240" role="img" aria-labelledby="title desc">
  <title id="title">KPro HTTP and HTTPS Internal Flow</title>
  <desc id="desc">Detailed HTTP and HTTPS call flow for KPro universal server, covering native httpx.Endpoint method and path routing.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2e3745" />
    </marker>
    <marker id="warnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#a05a00" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.14" />
    </filter>
    <style>
      .bg { fill: #f7f4ef; }
      .title { font: 700 38px "Microsoft YaHei", Arial, sans-serif; fill: #202631; }
      .subtitle { font: 400 18px "Microsoft YaHei", Arial, sans-serif; fill: #536070; }
      .laneTitle { font: 700 17px "Microsoft YaHei", Arial, sans-serif; fill: #566171; }
      .boxTitle { font: 700 18px "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .text { font: 400 14px "Microsoft YaHei", Arial, sans-serif; fill: #4f5a68; }
      .small { font: 400 12px "Microsoft YaHei", Arial, sans-serif; fill: #647084; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .setup { fill: #fff8e6; stroke: #d9a529; }
      .http { fill: #e8f4fb; stroke: #3182bd; }
      .route { fill: #e8f7f1; stroke: #2f8f83; }
      .ctx { fill: #eef0ff; stroke: #6870c9; }
      .app { fill: #eaf6df; stroke: #68a746; }
      .risk { fill: #fff2ed; stroke: #d47452; }
      .note { fill: #ffffff; stroke: #d8c7aa; }
      .line { fill: none; stroke: #2e3745; stroke-width: 2.3; marker-end: url(#arrow); }
      .lineThin { fill: none; stroke: #667085; stroke-width: 1.8; marker-end: url(#arrow); }
      .warn { fill: none; stroke: #a05a00; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#warnArrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1240" />
  <text class="title" x="54" y="64">KPro HTTP / HTTPS Call Flow and Internal Design</text>
  <text class="subtitle" x="54" y="96">HTTP and HTTPS use native method + path routing and do not convert requests into core.Message.</text>

  <rect x="40" y="126" width="1820" height="172" rx="14" fill="#f0e7d8" stroke="#dbc7a5" />
  <text class="laneTitle" x="64" y="154">1. User API and endpoint assembly</text>

  <rect class="box setup" x="70" y="190" width="250" height="78" rx="8" />
  <text class="boxTitle" x="102" y="222">server.New(config)</text>
  <text class="text" x="96" y="246">owns runner lifecycle</text>

  <rect class="box setup" x="380" y="174" width="270" height="110" rx="8" />
  <text class="boxTitle" x="438" y="206">app.HTTP</text>
  <text class="text" x="416" y="232">cfg.Addr = addr</text>
  <text class="text" x="416" y="254">httpx.New(cfg)</text>

  <rect class="box setup" x="710" y="174" width="286" height="110" rx="8" />
  <text class="boxTitle" x="766" y="206">app.HTTPS</text>
  <text class="text" x="738" y="232">cfg.Addr = addr</text>
  <text class="text" x="738" y="254">cfg.TLS = true</text>

  <rect class="box setup" x="1056" y="190" width="292" height="78" rx="8" />
  <text class="boxTitle" x="1110" y="222">MountRunner</text>
  <text class="text" x="1092" y="246">register httpx.Endpoint</text>

  <rect class="box setup" x="1408" y="190" width="306" height="78" rx="8" />
  <text class="boxTitle" x="1462" y="222">ListenAndServe</text>
  <text class="text" x="1436" y="246">go runner.ListenAndServe(ctx)</text>

  <path class="line" d="M320 229 L370 229" />
  <path class="line" d="M650 229 L700 229" />
  <path class="line" d="M996 229 L1046 229" />
  <path class="line" d="M1348 229 L1398 229" />

  <rect x="40" y="330" width="1820" height="246" rx="14" fill="#e8f7f1" stroke="#b9d9cd" />
  <text class="laneTitle" x="64" y="358">2. Route registration and compiled route table</text>

  <rect class="box route" x="70" y="410" width="260" height="92" rx="8" />
  <text class="boxTitle" x="128" y="442">Endpoint.Get</text>
  <text class="text" x="104" y="466">Post / Put / Delete</text>
  <text class="text" x="104" y="488">delegate to Handle</text>

  <rect class="box route" x="390" y="410" width="300" height="92" rx="8" />
  <text class="boxTitle" x="470" y="442">Handle</text>
  <text class="text" x="424" y="466">routes[path][method] = handler</text>
  <text class="text" x="424" y="488">protected by endpoint mutex</text>

  <rect class="box route" x="750" y="410" width="324" height="92" rx="8" />
  <text class="boxTitle" x="814" y="442">Use middleware</text>
  <text class="text" x="786" y="466">append core.Middleware</text>
  <text class="text" x="786" y="488">rebuild compiled handlers</text>

  <rect class="box route" x="1134" y="410" width="336" height="92" rx="8" />
  <text class="boxTitle" x="1190" y="442">rebuildCompiledLocked</text>
  <text class="text" x="1170" y="466">wrap handlers with middleware</text>
  <text class="text" x="1170" y="488">copy path and method maps</text>

  <rect class="box route" x="1530" y="410" width="300" height="92" rx="8" />
  <text class="boxTitle" x="1584" y="442">atomic.Value</text>
  <text class="text" x="1564" y="466">compiledRoutes</text>
  <text class="text" x="1564" y="488">lock-free read on request</text>

  <path class="line" d="M330 456 L380 456" />
  <path class="line" d="M690 456 L740 456" />
  <path class="line" d="M1074 456 L1124 456" />
  <path class="line" d="M1470 456 L1520 456" />

  <rect x="40" y="610" width="1820" height="244" rx="14" fill="#e8f4fb" stroke="#bfd5e6" />
  <text class="laneTitle" x="64" y="638">3. Server startup and request entry</text>

  <rect class="box http" x="70" y="690" width="270" height="96" rx="8" />
  <text class="boxTitle" x="124" y="722">Endpoint.ListenAndServe</text>
  <text class="text" x="104" y="746">buildServer()</text>
  <text class="text" x="104" y="768">store endpoint.server</text>

  <rect class="box http" x="400" y="690" width="300" height="96" rx="8" />
  <text class="boxTitle" x="476" y="722">net/http Server</text>
  <text class="text" x="434" y="746">Handler = endpoint.serve</text>
  <text class="text" x="434" y="768">timeouts + logger</text>

  <rect class="box http" x="760" y="690" width="320" height="96" rx="8" />
  <text class="boxTitle" x="832" y="722">HTTP or HTTPS</text>
  <text class="text" x="794" y="746">ListenAndServe(addr)</text>
  <text class="text" x="794" y="768">or ListenAndServeTLS(cert,key)</text>

  <rect class="box http" x="1140" y="690" width="300" height="96" rx="8" />
  <text class="boxTitle" x="1216" y="722">http.Request</text>
  <text class="text" x="1174" y="746">net/http parses request</text>
  <text class="text" x="1174" y="768">path, method, body, query</text>

  <rect class="box http" x="1500" y="690" width="300" height="96" rx="8" />
  <text class="boxTitle" x="1582" y="722">serve</text>
  <text class="text" x="1534" y="746">load compiled routes</text>
  <text class="text" x="1534" y="768">lookup path and method</text>

  <path class="line" d="M340 738 L390 738" />
  <path class="line" d="M700 738 L750 738" />
  <path class="line" d="M1080 738 L1130 738" />
  <path class="line" d="M1440 738 L1490 738" />

  <rect x="40" y="888" width="1820" height="262" rx="14" fill="#eef0ff" stroke="#c9cef8" />
  <text class="laneTitle" x="64" y="916">4. Route lookup, handler execution, response helpers, and error paths</text>

  <rect class="box ctx" x="70" y="972" width="250" height="112" rx="8" />
  <text class="boxTitle" x="118" y="1004">Lookup path</text>
  <text class="text" x="104" y="1030">routes[string(Path)]</text>
  <text class="text" x="104" y="1052">missing -> 404</text>

  <rect class="box ctx" x="380" y="972" width="250" height="112" rx="8" />
  <text class="boxTitle" x="420" y="1004">Lookup method</text>
  <text class="text" x="414" y="1030">methods[string(Method)]</text>
  <text class="text" x="414" y="1052">missing -> 405</text>

  <rect class="box ctx" x="690" y="972" width="274" height="112" rx="8" />
  <text class="boxTitle" x="748" y="1004">httpx.Context</text>
  <text class="text" x="724" y="1030">net/http-backed</text>
  <text class="text" x="724" y="1052">Body, Query, Path, Host</text>

  <rect class="box app" x="1024" y="972" width="274" height="112" rx="8" />
  <text class="boxTitle" x="1084" y="1004">HTTP Handler</text>
  <text class="text" x="1058" y="1030">handler(ctx)</text>
  <text class="text" x="1058" y="1052">middleware already wrapped</text>

  <rect class="box app" x="1358" y="948" width="306" height="86" rx="8" />
  <text class="boxTitle" x="1424" y="980">Response helpers</text>
  <text class="text" x="1392" y="1006">Text / JSON / Bytes / Stream / CopyBody</text>

  <rect class="box risk" x="1358" y="1060" width="306" height="70" rx="8" />
  <text class="boxTitle" x="1438" y="1090">Handler error</text>
  <text class="text" x="1392" y="1114">500 + err.Error()</text>

  <path class="line" d="M320 1028 L370 1028" />
  <path class="line" d="M630 1028 L680 1028" />
  <path class="line" d="M964 1028 L1014 1028" />
  <path class="line" d="M1298 1028 L1348 992" />
  <path class="lineThin" d="M1298 1028 L1348 1096" />

  <path class="warn" d="M195 1084 C195 1130, 480 1130, 480 1168" />
  <path class="warn" d="M505 1084 C505 1130, 750 1130, 750 1168" />

  <rect class="box risk" x="380" y="1168" width="220" height="48" rx="8" />
  <text class="text" x="438" y="1198">404 not found</text>

  <rect class="box risk" x="650" y="1168" width="260" height="48" rx="8" />
  <text class="text" x="704" y="1198">405 method not allowed</text>

  <rect class="box note" x="1000" y="1168" width="620" height="48" rx="8" />
  <text class="small" x="1020" y="1198">HTTP stays on httpx.Context; cross-protocol concerns use core.Middleware with core.Invocation instead of core.Message.</text>

  <rect class="box note" x="1500" y="830" width="300" height="48" rx="8" />
  <text class="small" x="1522" y="860">ctx.Done -> ShutdownWithContext</text>
</svg>
