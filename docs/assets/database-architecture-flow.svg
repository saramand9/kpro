<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">KPro Database And Eventing Architecture</title>
  <desc id="desc">Clean native GORM path for MySQL plus independent eventing contracts and concrete database adapters.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .band { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #42526e; stroke-width: 2; rx: 8; }
      .gorm { fill: #e8f5ff; stroke: #1f6feb; }
      .event { fill: #fff7e6; stroke: #b7791f; }
      .adapter { fill: #ecfdf3; stroke: #248a3d; }
      .warn { fill: #fff1f2; stroke: #be123c; }
      .label { font: 700 20px Arial, sans-serif; fill: #172033; }
      .small { font: 15px Arial, sans-serif; fill: #334155; }
      .tiny { font: 13px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #42526e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#42526e" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="980"/>
  <text x="48" y="56" class="label">KPro Database And Eventing Architecture</text>
  <text x="48" y="86" class="small">For MySQL, modules use native GORM directly. KPro only wraps connection lifecycle.</text>

  <rect class="band" x="40" y="120" width="430" height="790" rx="10"/>
  <text x="66" y="158" class="label">MySQL / GORM Write Path</text>
  <rect class="box" x="72" y="195" width="350" height="72"/>
  <text x="96" y="225" class="label">Handler</text>
  <text x="96" y="250" class="small">HTTP / gRPC / TCP / UDP</text>
  <rect class="box" x="72" y="305" width="350" height="72"/>
  <text x="96" y="335" class="label">Module Service</text>
  <text x="96" y="360" class="small">business validation and orchestration</text>
  <rect class="box gorm" x="72" y="415" width="350" height="82"/>
  <text x="96" y="446" class="label">Module GORM Repository</text>
  <text x="96" y="472" class="small">Create / Save / Delete / First / Find</text>
  <rect class="box gorm" x="72" y="535" width="350" height="82"/>
  <text x="96" y="566" class="label">database/relational/gorm</text>
  <text x="96" y="592" class="small">Open, Wrap, Ping, Health, Close</text>
  <rect class="box gorm" x="72" y="655" width="350" height="72"/>
  <text x="96" y="685" class="label">Native *gorm.DB</text>
  <text x="96" y="710" class="small">GORM API, dialector, transactions</text>
  <rect class="box gorm" x="72" y="765" width="350" height="58"/>
  <text x="96" y="801" class="label">MySQL</text>

  <path class="arrow" d="M247 267 V305"/>
  <path class="arrow" d="M247 377 V415"/>
  <path class="arrow" d="M247 497 V535"/>
  <path class="arrow" d="M247 617 V655"/>
  <path class="arrow" d="M247 727 V765"/>

  <rect class="band" x="535" y="120" width="430" height="790" rx="10"/>
  <text x="561" y="158" class="label">Eventing</text>
  <rect class="box event" x="567" y="205" width="350" height="84"/>
  <text x="591" y="236" class="label">eventing/events</text>
  <text x="591" y="262" class="small">Envelope, codec, registry</text>
  <rect class="box event" x="567" y="335" width="350" height="92"/>
  <text x="591" y="366" class="label">App Delivery Store</text>
  <text x="591" y="392" class="small">implements eventing/delivery.Store</text>
  <text x="591" y="414" class="tiny">storage chosen by application</text>
  <rect class="box event" x="567" y="475" width="350" height="88"/>
  <text x="591" y="506" class="label">eventing/projector.Runner</text>
  <text x="591" y="532" class="small">Fetch -> Handle -> Ack / Fail</text>
  <rect class="box event" x="567" y="610" width="350" height="88"/>
  <text x="591" y="641" class="label">Business Projector</text>
  <text x="591" y="667" class="small">module-owned mapping logic</text>
  <rect class="box warn" x="567" y="750" width="350" height="76"/>
  <text x="591" y="780" class="label">Not In GORM Adapter</text>
  <text x="591" y="806" class="small">GORM wrapper only: lifecycle + *gorm.DB</text>

  <path class="arrow dash" d="M422 340 H500 C530 340 530 247 567 247"/>
  <path class="arrow" d="M742 289 V335"/>
  <path class="arrow" d="M742 427 V475"/>
  <path class="arrow" d="M742 563 V610"/>

  <rect class="band" x="1030" y="120" width="430" height="790" rx="10"/>
  <text x="1056" y="158" class="label">Concrete Database Adapters</text>
  <rect class="box adapter" x="1062" y="205" width="350" height="58"/>
  <text x="1086" y="241" class="label">database/cache/redis</text>
  <rect class="box adapter" x="1062" y="300" width="350" height="58"/>
  <text x="1086" y="336" class="label">database/search/elasticsearch</text>
  <rect class="box adapter" x="1062" y="395" width="350" height="58"/>
  <text x="1086" y="431" class="label">database/vector/qdrant</text>
  <rect class="box adapter" x="1062" y="490" width="350" height="58"/>
  <text x="1086" y="526" class="label">database/document/mongodb</text>
  <rect class="box adapter" x="1062" y="585" width="350" height="58"/>
  <text x="1086" y="621" class="label">database/analytics/clickhouse</text>
  <rect class="box adapter" x="1062" y="680" width="350" height="58"/>
  <text x="1086" y="716" class="label">database/metrics/influxdb</text>

  <path class="arrow" d="M917 654 H990 C1015 654 1015 234 1062 234"/>
  <path class="arrow" d="M917 654 H990 C1015 654 1015 329 1062 329"/>
  <path class="arrow" d="M917 654 H990 C1015 654 1015 424 1062 424"/>
  <path class="arrow" d="M917 654 H990 C1015 654 1015 519 1062 519"/>
  <path class="arrow" d="M917 654 H990 C1015 654 1015 614 1062 614"/>
  <path class="arrow" d="M917 654 H990 C1015 654 1015 709 1062 709"/>

  <rect class="box" x="72" y="860" width="1340" height="50"/>
  <text x="96" y="891" class="small">Rule: database adapters execute storage operations; modules decide business data shape, transactions, events, and projections.</text>
</svg>
