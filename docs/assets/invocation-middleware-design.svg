<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1180" viewBox="0 0 1760 1180" role="img" aria-labelledby="title desc">
  <title id="title">KPro Unified Invocation Middleware Design</title>
  <desc id="desc">KPro middleware design where all protocols use one Invocation-based middleware API while message protocols keep their router and scheduling flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2d3748" />
    </marker>
    <marker id="softArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#111827" flood-opacity="0.13" />
    </filter>
    <style>
      .bg { fill: #f7f4ef; }
      .title { font: 700 38px "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 400 18px "Microsoft YaHei", Arial, sans-serif; fill: #5b6472; }
      .sectionTitle { font: 700 20px "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .boxTitle { font: 700 17px "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .text { font: 400 13px "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .small { font: 400 12px "Microsoft YaHei", Arial, sans-serif; fill: #667085; }
      .code { font: 500 12px Consolas, "Microsoft YaHei", monospace; fill: #374151; }
      .lane { fill: #ffffff; stroke: #d4c7b4; stroke-width: 2; }
      .message { fill: #eef6ff; stroke: #3a7bbf; }
      .native { fill: #edf8f2; stroke: #2f8f70; }
      .invocation { fill: #f1efff; stroke: #6d63c8; }
      .middleware { fill: #fff4de; stroke: #d5972b; }
      .handler { fill: #fdeeee; stroke: #c9695e; }
      .note { fill: #ffffff; stroke: #d8c7aa; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .line { fill: none; stroke: #2d3748; stroke-width: 2.3; marker-end: url(#arrow); }
      .softLine { fill: none; stroke: #6b7280; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#softArrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1760" height="1180" />
  <text class="title" x="54" y="64">KPro Unified Invocation Middleware Design</text>
  <text class="subtitle" x="54" y="96">One middleware API, protocol-native routing preserved. Message protocols still use Router scheduling; native protocols take a shorter path.</text>

  <rect class="note" x="54" y="126" width="1652" height="110" rx="10" />
  <text class="boxTitle" x="80" y="162">Design thesis</text>
  <text class="text" x="80" y="190">Middleware does not need every protocol to become core.Message. It only needs a stable Invocation view of the current business call.</text>
  <text class="text" x="80" y="214">Protocol-specific objects remain available through Native(), but common middleware uses Transport, Operation, metadata and payload.</text>

  <rect class="lane" x="54" y="272" width="800" height="705" rx="12" />
  <text class="sectionTitle" x="80" y="310">Message protocols</text>
  <text class="small" x="80" y="334">TCP / UDP / WebSocket keep protocol decode, Router, queueing and per-session scheduling.</text>

  <rect class="box message" x="96" y="370" width="285" height="74" rx="8" />
  <text class="boxTitle" x="122" y="398">Transport input</text>
  <text class="text" x="122" y="424">bytes / datagram / WS frame</text>

  <rect class="box message" x="500" y="370" width="285" height="74" rx="8" />
  <text class="boxTitle" x="526" y="398">Protocol decode</text>
  <text class="text" x="526" y="424">StreamCodec / PacketCodec</text>

  <rect class="box message" x="96" y="490" width="285" height="84" rx="8" />
  <text class="boxTitle" x="122" y="520">core.Context</text>
  <text class="text" x="122" y="546">Session + core.Message</text>

  <rect class="box message" x="500" y="490" width="285" height="84" rx="8" />
  <text class="boxTitle" x="526" y="520">core.Router</text>
  <text class="text" x="526" y="546">match Message.ID</text>
  <text class="small" x="526" y="566">decide sync / async mode</text>

  <rect class="box message" x="96" y="620" width="285" height="92" rx="8" />
  <text class="boxTitle" x="122" y="650">Scheduling</text>
  <text class="text" x="122" y="676">per-session queue</text>
  <text class="small" x="122" y="696">or async worker queue</text>

  <rect class="box invocation" x="500" y="620" width="285" height="92" rx="8" />
  <text class="boxTitle" x="526" y="650">MessageInvocation</text>
  <text class="text" x="526" y="676">built at handler execution time</text>
  <text class="small" x="526" y="696">Native() = core.Context</text>

  <rect class="box middleware" x="96" y="758" width="285" height="92" rx="8" />
  <text class="boxTitle" x="122" y="788">Unified Middleware</text>
  <text class="text" x="122" y="814">auth / rate limit / trace</text>
  <text class="small" x="122" y="834">measures real handler time</text>

  <rect class="box handler" x="500" y="758" width="285" height="92" rx="8" />
  <text class="boxTitle" x="526" y="788">Message handler</text>
  <text class="text" x="526" y="814">business code</text>
  <text class="small" x="526" y="834">ctx.Reply / ctx.Error</text>

  <rect class="box message" x="300" y="890" width="285" height="58" rx="8" />
  <text class="boxTitle" x="326" y="925">Encode + write response</text>

  <path class="line" d="M381 407 H500" />
  <path class="line" d="M642 444 V490" />
  <path class="line" d="M500 532 H381" />
  <path class="line" d="M238 574 V620" />
  <path class="line" d="M381 666 H500" />
  <path class="line" d="M642 712 V758" />
  <path class="line" d="M500 804 H381" />
  <path class="line" d="M238 850 C238 890 300 890 348 903" />
  <path class="line" d="M642 850 C642 890 585 890 537 903" />

  <rect class="lane" x="906" y="272" width="800" height="705" rx="12" />
  <text class="sectionTitle" x="932" y="310">Protocol-native paths</text>
  <text class="small" x="932" y="334">HTTP / HTTPS / SSE / gRPC do not convert to core.Message and do not use core.Router.</text>

  <rect class="box native" x="950" y="370" width="285" height="82" rx="8" />
  <text class="boxTitle" x="976" y="400">Native request / stream</text>
  <text class="text" x="976" y="426">HTTP request, SSE stream</text>
  <text class="small" x="976" y="444">gRPC unary or stream</text>

  <rect class="box native" x="1356" y="370" width="285" height="82" rx="8" />
  <text class="boxTitle" x="1382" y="400">Native routing</text>
  <text class="text" x="1382" y="426">method + path</text>
  <text class="small" x="1382" y="444">or gRPC full method</text>

  <rect class="box invocation" x="950" y="520" width="285" height="100" rx="8" />
  <text class="boxTitle" x="976" y="550">NativeInvocation</text>
  <text class="text" x="976" y="576">common fields</text>
  <text class="small" x="976" y="596">Native() = protocol context</text>

  <rect class="box middleware" x="1356" y="520" width="285" height="100" rx="8" />
  <text class="boxTitle" x="1382" y="550">Unified Middleware</text>
  <text class="text" x="1382" y="576">same API as Message path</text>
  <text class="small" x="1382" y="596">inline around native handler</text>

  <rect class="box handler" x="950" y="690" width="285" height="100" rx="8" />
  <text class="boxTitle" x="976" y="720">Native handler</text>
  <text class="text" x="976" y="746">httpx.Context / sse.Context</text>
  <text class="small" x="976" y="766">grpc service handler</text>

  <rect class="box native" x="1356" y="690" width="285" height="100" rx="8" />
  <text class="boxTitle" x="1382" y="720">Native response</text>
  <text class="text" x="1382" y="746">HTTP response</text>
  <text class="small" x="1382" y="766">SSE events / gRPC messages</text>

  <rect class="box note" x="1060" y="842" width="470" height="106" rx="8" />
  <text class="boxTitle" x="1086" y="874">Shorter path does not mean weaker middleware</text>
  <text class="text" x="1086" y="902">Non-message protocols skip binary Message decode and Router scheduling.</text>
  <text class="text" x="1086" y="928">They still execute the same middleware contract before business code.</text>

  <path class="line" d="M1235 411 H1356" />
  <path class="line" d="M1498 452 V520" />
  <path class="line" d="M1356 570 H1235" />
  <path class="line" d="M1092 620 V690" />
  <path class="line" d="M1235 740 H1356" />

  <rect class="box invocation" x="410" y="1018" width="940" height="112" rx="10" />
  <text class="boxTitle" x="442" y="1050">core.Invocation</text>
  <text class="code" x="442" y="1078">Transport()  Operation()  ConnID()  RemoteAddr()  Headers()  Meta()  Payload()</text>
  <text class="code" x="442" y="1104">Context()  Native() any</text>
  <text class="small" x="910" y="1104">Native is the escape hatch; ordinary middleware should use stable fields.</text>

  <path class="softLine" d="M642 712 C690 940 742 990 822 1018" />
  <path class="softLine" d="M1092 620 C1080 880 1036 970 940 1018" />
</svg>


