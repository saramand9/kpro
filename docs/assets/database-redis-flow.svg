<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240" role="img" aria-labelledby="title desc">
  <title id="title">KPro Redis 流程</title>
  <desc id="desc">Redis 适配层详细流程，展示启动、event projector 写缓存、缓存读取，以及 Redis helper 能力对应的文件和数据边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 31px Arial, 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, 'Microsoft YaHei', sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .label { font: 700 14px Arial, 'Microsoft YaHei', sans-serif; fill: #111827; }
      .small { font: 400 12px Arial, 'Microsoft YaHei', sans-serif; fill: #475569; }
      .tiny { font: 400 10.5px Arial, 'Microsoft YaHei', sans-serif; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; }
      .startup { fill: #ecfeff; stroke: #0891b2; }
      .domain { fill: #eef2ff; stroke: #6366f1; }
      .source { fill: #f0fdf4; stroke: #16a34a; }
      .event { fill: #fff7ed; stroke: #ea580c; }
      .redis { fill: #fef2f2; stroke: #dc2626; }
      .read { fill: #fdf2f8; stroke: #db2777; }
      .external { fill: #f1f5f9; stroke: #64748b; }
      .group { fill: none; stroke: #cbd5e1; stroke-width: 1.3; rx: 10; }
      .line { stroke: #334155; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow-soft); }
    </style>
  </defs>

  <rect class="bg" width="1680" height="1240"/>
  <text x="48" y="54" class="title">KPro Redis 流程</text>
  <text x="48" y="82" class="subtitle">Redis 通常作为读模型、锁、Stream 或排序存储。事务数据仍然有明确 source-of-truth，projector 通过 database/redis helper 更新 Redis。</text>

  <rect x="44" y="112" width="760" height="270" class="group"/>
  <text x="66" y="142" class="section">1. 启动：创建并验证 Redis 资源</text>

  <rect x="78" y="172" width="188" height="82" class="box startup"/>
  <text x="100" y="200" class="label">应用装配</text>
  <text x="100" y="222" class="small">输入：Config</text>
  <text x="100" y="244" class="tiny">Name, Addr, DB, KeyPrefix</text>

  <rect x="306" y="172" width="188" height="82" class="box startup"/>
  <text x="328" y="200" class="label">config.go</text>
  <text x="328" y="222" class="small">normalizeConfig</text>
  <text x="328" y="244" class="tiny">输出：默认值或 error</text>

  <rect x="534" y="172" width="220" height="82" class="box startup"/>
  <text x="556" y="200" class="label">client.go</text>
  <text x="556" y="222" class="small">Open -> NewClient -> Ping</text>
  <text x="556" y="244" class="tiny">输出：*redisstore.Client</text>

  <rect x="250" y="286" width="270" height="70" class="box external"/>
  <text x="272" y="314" class="label">database/common/lifecycle.Resource</text>
  <text x="272" y="336" class="small">Name, KindRedis, Health, Close</text>

  <path class="line" d="M266 213 H306"/>
  <path class="line" d="M494 213 H534"/>
  <path class="line" d="M644 254 C620 286, 520 308, 520 320"/>

  <rect x="844" y="112" width="792" height="270" class="group"/>
  <text x="866" y="142" class="section">2. 创建 Redis 能力 helper</text>

  <rect x="882" y="174" width="172" height="78" class="box redis"/>
  <text x="904" y="202" class="label">client.go</text>
  <text x="904" y="224" class="small">Cache[T](client)</text>
  <text x="904" y="244" class="tiny">输出：CacheView[T]</text>

  <rect x="1090" y="174" width="172" height="78" class="box redis"/>
  <text x="1112" y="202" class="label">client.go</text>
  <text x="1112" y="224" class="small">Lock(key, ttl)</text>
  <text x="1112" y="244" class="tiny">输出：Lock</text>

  <rect x="1298" y="174" width="172" height="78" class="box redis"/>
  <text x="1320" y="202" class="label">client.go</text>
  <text x="1320" y="224" class="small">Stream(key)</text>
  <text x="1320" y="244" class="tiny">输出：Stream</text>

  <rect x="1090" y="284" width="172" height="72" class="box redis"/>
  <text x="1112" y="312" class="label">client.go</text>
  <text x="1112" y="334" class="small">ZSet(key)</text>

  <path class="dash" d="M754 213 H882"/>
  <path class="dash" d="M754 213 C910 270, 1020 314, 1090 320"/>
  <path class="dash" d="M754 213 H1090"/>
  <path class="dash" d="M754 213 H1298"/>

  <rect x="44" y="420" width="1592" height="442" class="group"/>
  <text x="66" y="450" class="section">3. 典型写入：source 写入产生 event，projector 写 Redis cache</text>

  <rect x="78" y="486" width="176" height="84" class="box domain"/>
  <text x="100" y="514" class="label">Handler</text>
  <text x="100" y="536" class="small">输入：CreateUser</text>
  <text x="100" y="558" class="tiny">输出：command DTO</text>

  <rect x="294" y="486" width="176" height="84" class="box domain"/>
  <text x="316" y="514" class="label">Service</text>
  <text x="316" y="536" class="small">校验业务命令</text>
  <text x="316" y="558" class="tiny">输出：model + event</text>

  <rect x="510" y="486" width="188" height="84" class="box source"/>
  <text x="532" y="514" class="label">GORM SQL</text>
  <text x="532" y="536" class="small">source-of-truth 写入</text>
  <text x="532" y="558" class="tiny">输出：事务行已提交</text>

  <rect x="738" y="486" width="188" height="84" class="box event"/>
  <text x="760" y="514" class="label">events/*.go</text>
  <text x="760" y="536" class="small">Encode + NewEnvelope</text>
  <text x="760" y="558" class="tiny">输出：events.Envelope</text>

  <rect x="966" y="486" width="188" height="84" class="box event"/>
  <text x="988" y="514" class="label">app delivery store</text>
  <text x="988" y="536" class="small">Append</text>
  <text x="988" y="558" class="tiny">输出：durable event record</text>

  <rect x="1208" y="486" width="188" height="84" class="box event"/>
  <text x="1230" y="514" class="label">projector/runner.go</text>
  <text x="1230" y="536" class="small">RunOnce -> Fetch</text>
  <text x="1230" y="558" class="tiny">输出：delivery.Record</text>

  <rect x="1428" y="486" width="164" height="84" class="box domain"/>
  <text x="1450" y="514" class="label">模块 projector</text>
  <text x="1450" y="536" class="small">Handle(envelope)</text>
  <text x="1450" y="558" class="tiny">event -> cache</text>

  <path class="line" d="M254 528 H294"/>
  <path class="line" d="M470 528 H510"/>
  <path class="line" d="M698 528 H738"/>
  <path class="line" d="M926 528 H966"/>
  <path class="line" d="M1154 528 H1208"/>
  <path class="line" d="M1396 528 H1428"/>

  <rect x="338" y="626" width="238" height="88" class="box event"/>
  <text x="360" y="654" class="label">event 边界数据</text>
  <text x="360" y="676" class="small">UserCreated -> JSON</text>
  <text x="360" y="698" class="tiny">Envelope{evt_9001,user.created,u_1001}</text>

  <rect x="646" y="626" width="238" height="88" class="box event"/>
  <text x="668" y="654" class="label">delivery 边界数据</text>
  <text x="668" y="676" class="small">durable event record</text>
  <text x="668" y="698" class="tiny">delivery: status=inflight</text>

  <rect x="954" y="626" width="238" height="88" class="box redis"/>
  <text x="976" y="654" class="label">cache.go</text>
  <text x="976" y="676" class="small">CacheView.Set</text>
  <text x="976" y="698" class="tiny">输入：key + typed value + ttl</text>

  <rect x="1262" y="626" width="238" height="88" class="box redis"/>
  <text x="1284" y="654" class="label">client.go + go-redis</text>
  <text x="1284" y="676" class="small">key prefix + SET</text>
  <text x="1284" y="698" class="tiny">SET kpro:users:u_1001 JSON EX 1800</text>

  <path class="dash" d="M832 570 C770 606, 604 626, 576 670"/>
  <path class="dash" d="M1060 570 C1000 608, 884 626, 884 670"/>
  <path class="line" d="M1510 570 C1510 610, 1073 586, 1073 626"/>
  <path class="line" d="M1192 670 H1262"/>

  <rect x="1060" y="762" width="258" height="70" class="box event"/>
  <text x="1082" y="790" class="label">runner 结果</text>
  <text x="1082" y="812" class="small">成功：Ack；失败：Fail/retry/dead</text>

  <path class="dash" d="M1381 714 C1360 758, 1318 780, 1318 797"/>

  <rect x="44" y="900" width="1052" height="250" class="group"/>
  <text x="66" y="930" class="section">4. Cache 读取路径</text>

  <rect x="78" y="972" width="170" height="82" class="box domain"/>
  <text x="100" y="1000" class="label">Handler</text>
  <text x="100" y="1022" class="small">GET /users/u_1001</text>
  <text x="100" y="1044" class="tiny">输出：query DTO</text>

  <rect x="288" y="972" width="170" height="82" class="box domain"/>
  <text x="310" y="1000" class="label">Service</text>
  <text x="310" y="1022" class="small">cache-first query</text>
  <text x="310" y="1044" class="tiny">miss 时回源查询</text>

  <rect x="498" y="972" width="194" height="82" class="box read"/>
  <text x="520" y="1000" class="label">readmodels/views.go</text>
  <text x="520" y="1022" class="small">Cache[T] interface</text>
  <text x="520" y="1044" class="tiny">Get(ctx,key) contract</text>

  <rect x="732" y="972" width="170" height="82" class="box redis"/>
  <text x="754" y="1000" class="label">cache.go</text>
  <text x="754" y="1022" class="small">CacheView.Get</text>
  <text x="754" y="1044" class="tiny">GET + JSON unmarshal</text>

  <rect x="942" y="972" width="118" height="82" class="box external"/>
  <text x="964" y="1000" class="label">Redis</text>
  <text x="964" y="1022" class="small">GET key</text>
  <text x="964" y="1044" class="tiny">bytes 或 nil</text>

  <path class="line" d="M248 1013 H288"/>
  <path class="line" d="M458 1013 H498"/>
  <path class="line" d="M692 1013 H732"/>
  <path class="line" d="M902 1013 H942"/>
  <path class="dash" d="M942 1044 C860 1112, 630 1118, 458 1048"/>

  <rect x="1138" y="900" width="498" height="250" class="group"/>
  <text x="1160" y="930" class="section">5. 其他 Redis helper 路径</text>

  <rect x="1174" y="968" width="205" height="62" class="box redis"/>
  <text x="1196" y="994" class="label">lock.go</text>
  <text x="1196" y="1016" class="small">SETNX + token + Lua release</text>

  <rect x="1400" y="968" width="205" height="62" class="box redis"/>
  <text x="1422" y="994" class="label">stream.go</text>
  <text x="1422" y="1016" class="small">XADD / XREAD / XACK</text>

  <rect x="1287" y="1058" width="205" height="62" class="box redis"/>
  <text x="1309" y="1084" class="label">zset.go</text>
  <text x="1309" y="1106" class="small">ZADD / ZINCRBY / ZRANGE</text>

  <path class="dash" d="M1176 252 C1160 600, 1250 850, 1276 968"/>
  <path class="dash" d="M1384 252 C1395 600, 1480 850, 1502 968"/>
  <path class="dash" d="M1176 356 C1185 650, 1330 850, 1389 1058"/>
</svg>
