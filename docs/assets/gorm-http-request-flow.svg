<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1360" viewBox="0 0 1880 1360" role="img" aria-labelledby="title desc">
  <title id="title">HTTP request to GORM insert flow</title>
  <desc id="desc">A POST /users request moves through HTTP routing, handler, service, service port, GORM store, native GORM, and the database. Each step shows input, work, and output.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, 'Microsoft YaHei', sans-serif; fill: #475569; }
      .section { font: 700 20px Arial, 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .startup { fill: #ecfeff; stroke: #0891b2; }
      .http { fill: #eef2ff; stroke: #6366f1; }
      .module { fill: #f0fdf4; stroke: #16a34a; }
      .gorm { fill: #e8f5ff; stroke: #1f6feb; }
      .db { fill: #fff7ed; stroke: #ea580c; }
      .response { fill: #fdf2f8; stroke: #db2777; }
      .label { font: 700 16px Arial, 'Microsoft YaHei', sans-serif; fill: #111827; }
      .file { font: 400 12px Consolas, 'Microsoft YaHei', monospace; fill: #475569; }
      .small { font: 400 13px Arial, 'Microsoft YaHei', sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, 'Microsoft YaHei', sans-serif; fill: #64748b; }
      .input { fill: #1d4ed8; font-weight: 700; }
      .work { fill: #15803d; font-weight: 700; }
      .output { fill: #b45309; font-weight: 700; }
      .line { stroke: #334155; stroke-width: 1.9; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .note { fill: #fff1f2; stroke: #be123c; stroke-width: 1.4; rx: 8; }
    </style>
  </defs>

  <rect class="bg" width="1880" height="1360"/>
  <text x="48" y="54" class="title">POST /users to GORM Write Flow</text>
  <text x="48" y="84" class="subtitle">Each node identifies its input, work, and output. The users module is shown; projects follows the same structure.</text>

  <rect x="44" y="118" width="1792" height="252" class="box"/>
  <text x="70" y="152" class="section">0. Startup assembly: completed before requests arrive</text>

  <rect x="78" y="184" width="330" height="136" class="box startup"/>
  <text x="102" y="210" class="label">main.go</text>
  <text x="102" y="230" class="file">examples/gorm-http/server/main.go</text>
  <text x="102" y="256" class="small"><tspan class="input">Input:</tspan> gormstore.Config</text>
  <text x="102" y="278" class="tiny">Dialector, pool config, name</text>
  <text x="102" y="300" class="small"><tspan class="work">Work:</tspan> gormstore.Open + app.Manage</text>
  <text x="102" y="322" class="small"><tspan class="output">Output:</tspan> *gormstore.Database</text>

  <rect x="458" y="184" width="330" height="136" class="box startup"/>
  <text x="482" y="210" class="label">database.go</text>
  <text x="482" y="230" class="file">database/gorm/database.go</text>
  <text x="482" y="256" class="small"><tspan class="input">Input:</tspan> Dialector or existing *gorm.DB</text>
  <text x="482" y="278" class="small"><tspan class="work">Work:</tspan> gorm.Open, pool, Ping</text>
  <text x="482" y="300" class="small"><tspan class="output">Output:</tspan> health-checkable Database</text>
  <text x="482" y="322" class="tiny">Lifecycle wrapper only; no CRUD</text>

  <rect x="838" y="184" width="330" height="136" class="box startup"/>
  <text x="862" y="210" class="label">schema.go + model.go</text>
  <text x="862" y="230" class="file">app/schema.go, users/model.go</text>
  <text x="862" y="256" class="small"><tspan class="input">Input:</tspan> *gormstore.Database</text>
  <text x="862" y="278" class="small"><tspan class="work">Work:</tspan> versioned SQL migrations</text>
  <text x="862" y="300" class="small"><tspan class="output">Output:</tspan> users schema ready</text>

  <rect x="1218" y="184" width="330" height="136" class="box startup"/>
  <text x="1242" y="210" class="label">stores.go + modules.go</text>
  <text x="1242" y="230" class="file">app/stores.go, app/modules.go</text>
  <text x="1242" y="256" class="small"><tspan class="input">Input:</tspan> *gormstore.Database</text>
  <text x="1242" y="278" class="small"><tspan class="work">Work:</tspan> NewGORM -> NewWithStore</text>
  <text x="1242" y="300" class="small"><tspan class="output">Output:</tspan> handler owns service</text>
  <text x="1242" y="322" class="tiny">Store retains native *gorm.DB</text>

  <path class="dash" d="M408 252 H458"/>
  <path class="dash" d="M788 252 H838"/>
  <path class="dash" d="M1168 252 H1218"/>

  <rect x="44" y="416" width="1792" height="858" class="box"/>
  <text x="70" y="450" class="section">1. Request path: one POST /users write</text>

  <rect x="78" y="490" width="340" height="140" class="box http"/>
  <text x="102" y="518" class="label">HTTP Client</text>
  <text x="102" y="544" class="small"><tspan class="input">Input:</tspan> submitted request</text>
  <text x="102" y="566" class="tiny">POST /users</text>
  <text x="102" y="588" class="tiny">{"name":"Ada","age":37}</text>
  <text x="102" y="612" class="small"><tspan class="output">Output:</tspan> raw HTTP request</text>

  <rect x="488" y="490" width="340" height="140" class="box http"/>
  <text x="512" y="518" class="label">HTTP Endpoint / Router</text>
  <text x="512" y="538" class="file">transport/httpx + server</text>
  <text x="512" y="564" class="small"><tspan class="input">Input:</tspan> raw HTTP request</text>
  <text x="512" y="586" class="small"><tspan class="work">Work:</tspan> match POST /users</text>
  <text x="512" y="608" class="small"><tspan class="output">Output:</tspan> *httpx.Context invokes handler</text>

  <rect x="898" y="490" width="340" height="140" class="box http"/>
  <text x="922" y="518" class="label">users HTTP handler</text>
  <text x="922" y="538" class="file">internal/modules/users/handler/http.go</text>
  <text x="922" y="564" class="small"><tspan class="input">Input:</tspan> *httpx.Context</text>
  <text x="922" y="586" class="small"><tspan class="work">Work:</tspan> JSONBody -> CreateRequest</text>
  <text x="922" y="608" class="small"><tspan class="output">Output:</tspan> CreateInput{Name, Age}</text>

  <rect x="1308" y="490" width="340" height="140" class="box module"/>
  <text x="1332" y="518" class="label">users Service</text>
  <text x="1332" y="538" class="file">internal/modules/users/service/service.go</text>
  <text x="1332" y="564" class="small"><tspan class="input">Input:</tspan> CreateInput{Name:"Ada", Age:37}</text>
  <text x="1332" y="586" class="small"><tspan class="work">Work:</tspan> trim + validate + build model</text>
  <text x="1332" y="608" class="small"><tspan class="output">Output:</tspan> users.User{Name, Age}</text>

  <path class="line" d="M418 560 H488"/>
  <path class="line" d="M828 560 H898"/>
  <path class="line" d="M1238 560 H1308"/>

  <rect x="1308" y="716" width="340" height="140" class="box module"/>
  <text x="1332" y="744" class="label">UserStore Port</text>
  <text x="1332" y="764" class="file">internal/modules/users/service/port.go</text>
  <text x="1332" y="790" class="small"><tspan class="input">Input:</tspan> users.User</text>
  <text x="1332" y="812" class="small"><tspan class="work">Work:</tspan> call Create(ctx, user) port</text>
  <text x="1332" y="834" class="small"><tspan class="output">Output:</tspan> concrete store invocation</text>

  <rect x="898" y="716" width="340" height="140" class="box gorm"/>
  <text x="922" y="744" class="label">users GORM store</text>
  <text x="922" y="764" class="file">internal/modules/users/store/store.go</text>
  <text x="922" y="790" class="small"><tspan class="input">Input:</tspan> ctx + users.User{Name, Age}</text>
  <text x="922" y="812" class="small"><tspan class="work">Work:</tspan> db.WithContext(ctx).Create(&amp;user)</text>
  <text x="922" y="834" class="small"><tspan class="output">Output:</tspan> user.ID / CreatedAt populated</text>

  <rect x="488" y="716" width="340" height="140" class="box gorm"/>
  <text x="512" y="744" class="label">Native GORM</text>
  <text x="512" y="764" class="file">gorm.io/gorm</text>
  <text x="512" y="790" class="small"><tspan class="input">Input:</tspan> users.User + GORM tags</text>
  <text x="512" y="812" class="small"><tspan class="work">Work:</tspan> generate and execute INSERT SQL</text>
  <text x="512" y="834" class="small"><tspan class="output">Output:</tspan> SQL result / generated fields</text>

  <rect x="78" y="716" width="340" height="140" class="box db"/>
  <text x="102" y="744" class="label">Database</text>
  <text x="102" y="764" class="file">MySQL / SQLite / Postgres</text>
  <text x="102" y="790" class="small"><tspan class="input">Input:</tspan> INSERT INTO users ...</text>
  <text x="102" y="812" class="small"><tspan class="work">Work:</tspan> store row; generate ID/time</text>
  <text x="102" y="834" class="small"><tspan class="output">Output:</tspan> users row persisted</text>

  <path class="line" d="M1478 630 V716"/>
  <path class="line" d="M1308 786 H1238"/>
  <path class="line" d="M898 786 H828"/>
  <path class="line" d="M488 786 H418"/>

  <rect x="78" y="942" width="340" height="140" class="box db"/>
  <text x="102" y="970" class="label">Read Back Row</text>
  <text x="102" y="990" class="file">users/store.go Find</text>
  <text x="102" y="1016" class="small"><tspan class="input">Input:</tspan> inserted user.ID</text>
  <text x="102" y="1038" class="small"><tspan class="work">Work:</tspan> First(&amp;user, id)</text>
  <text x="102" y="1060" class="small"><tspan class="output">Output:</tspan> complete persisted User</text>

  <rect x="488" y="942" width="340" height="140" class="box module"/>
  <text x="512" y="970" class="label">Return Through Service</text>
  <text x="512" y="990" class="file">service.Create -> handler</text>
  <text x="512" y="1016" class="small"><tspan class="input">Input:</tspan> persisted User</text>
  <text x="512" y="1038" class="small"><tspan class="work">Work:</tspan> return without further mutation</text>
  <text x="512" y="1060" class="small"><tspan class="output">Output:</tspan> handler receives created value</text>

  <rect x="898" y="942" width="340" height="140" class="box response"/>
  <text x="922" y="970" class="label">HTTP Response</text>
  <text x="922" y="990" class="file">handler/http.go</text>
  <text x="922" y="1016" class="small"><tspan class="input">Input:</tspan> created User</text>
  <text x="922" y="1038" class="small"><tspan class="work">Work:</tspan> ctx.JSON(201, created)</text>
  <text x="922" y="1060" class="small"><tspan class="output">Output:</tspan> HTTP 201 + JSON body</text>

  <rect x="1308" y="942" width="340" height="140" class="box response"/>
  <text x="1332" y="970" class="label">Client Receives</text>
  <text x="1332" y="1016" class="small"><tspan class="input">Input:</tspan> HTTP response</text>
  <text x="1332" y="1038" class="small"><tspan class="work">Work:</tspan> client decodes response</text>
  <text x="1332" y="1060" class="small"><tspan class="output">Output:</tspan> User{id,name,age,created_at}</text>

  <path class="line" d="M248 856 V942"/>
  <path class="line" d="M418 1012 H488"/>
  <path class="line" d="M828 1012 H898"/>
  <path class="line" d="M1238 1012 H1308"/>

  <rect x="78" y="1160" width="1570" height="72" class="note"/>
  <text x="104" y="1190" class="label">Key boundary</text>
  <text x="104" y="1218" class="small">database/gorm provides *gorm.DB lifecycle at startup; request writes occur in internal/modules/users/store/store.go through native GORM.</text>
</svg>
