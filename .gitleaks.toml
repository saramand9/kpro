[extend]
useDefault = true

[[allowlists]]
description = "Fixed WebSocket handshake test nonces, including decoded 0123456789abcdef"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''(?:^|/)transport/websocket/(?:conformance_test|contract_suite_test|proxy_protocol_test|server_test)\.go$''',
]
regexes = [
  '''^(?:(?:dGhlIHNhbXBsZSBub25jZQ|MDEyMzQ1Njc4OWFiY2RlZg)={0,2}|0123456789abcdef)$''',
]
